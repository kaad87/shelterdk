# Netlify deploy for ShelterDK (Next.js)
# Når Base directory = web i Netlify UI, kører alt herfra.

[build]
  command = "npm run build"
  # Publish udelades – @netlify/plugin-nextjs håndterer output

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Image CDN: /.netlify/images?url=...&w=...&q=... transformerer på
# edge. Erstatter /api/image-funktionen i prod (sharp fejlede dér og streamede
# 1,6-3,3 MB originaler igennem = bandwidth-lækage). Kun hosts der IKKE står
# på skip-listen i lib/image-proxy.ts (skip-hosts loades direkte i browseren).
[images]
  remote_images = [
    "https://winiuqqbllntgjeowkbs\\.supabase\\.co/storage/.*",
    "https://geofa\\.geodanmark\\.dk/.*",
    "https://udinaturen\\.dk/.*",
    "https://book\\.naturstyrelsen\\.dk/.*",
    "https://naturstyrelsen\\.dk/.*",
    "https://kortservice2\\.vejle\\.dk/.*",
    "https://apps\\.aalborgkommune\\.dk/.*",
    "https://webkort\\.esbjergkommune\\.dk/.*",
    "https://webkort\\.herning\\.dk/.*",
  ]

# www → apex så én kanonisk URL (Chrome har nogle gange socket-problem på www)
[[redirects]]
  from = "https://www.shelterdk.dk/*"
  to = "https://shelterdk.dk/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
