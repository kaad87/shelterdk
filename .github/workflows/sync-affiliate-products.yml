name: Daglig affiliate-produkt-sync

# Flyttet fra Netlify scheduled function: synken er for tung (~10k produkter,
# flere minutter) til Netlifys ~10-30s funktions-timeout. GitHub Actions har
# ingen kort timeout og kører scriptet i et almindeligt Node-miljø.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC dagligt (≈ 05:00 DK sommer)
  workflow_dispatch: {} # tillad manuel kørsel fra Actions-fanen

concurrency:
  group: affiliate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Kør produkt-sync (priser/lager + freshness-motor)
        run: npm run sync-products
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PARTNER_ADS_BACKPACKERLIFE_URL: ${{ secrets.PARTNER_ADS_BACKPACKERLIFE_URL }}
          PARTNER_ADS_OUTDOORTID_URL: ${{ secrets.PARTNER_ADS_OUTDOORTID_URL }}
          PARTNER_ADS_OUTMORE_URL: ${{ secrets.PARTNER_ADS_OUTMORE_URL }}
