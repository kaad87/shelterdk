name: NST availability-sync

# Flyttet fra Netlify scheduled function: batchen synker ~206 Naturstyrelsen-
# shelters SEKVENTIELT med eksterne kald (flere minutter) — langt over Netlifys
# ~10-30s funktions-timeout. Derfor stod ledigheds-kalenderen stille (sidst
# opdateret 16.05) mens Naturstyrelsens egen kalender viste optaget.
# Samme mønster som sync-affiliate-products.yml.

on:
  schedule:
    # 4×dagligt (UTC) ≈ 08/12/16/20 DK sommer — matcher den gamle Netlify-cron.
    - cron: "0 6,10,14,18 * * *"
  workflow_dispatch: {}

concurrency:
  group: nst-availability-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Synk Naturstyrelsen-ledighed (206 shelters)
        run: npm run sync:nst-availability
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
